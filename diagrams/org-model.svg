  <text x="48" y="46" font-size="15" fill="#0f172a" font-weight="600">orchart · recursive org model</text>
  <text x="48" y="68" font-size="11" fill="#64748b">solid = authority (single parent, narrows downward) · dashed = secondment (accountability moves, authority does not)</text>

