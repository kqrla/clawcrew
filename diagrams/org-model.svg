  <!-- ===== secondments ===== -->
  <path d="M300,400 C300,470 900,470 1000,516" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <path d="M860,400 C860,462 500,470 400,516" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>

  <rect x="905" y="520" width="250" height="66" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="1030" y="540" font-size="11" fill="#78350f" text-anchor="middle" font-weight="600">launch deliverable</text>
  <text x="1030" y="556" font-size="10" fill="#92400e" text-anchor="middle">assets for launch page</text>
  <text x="1030" y="571" font-size="10" fill="#92400e" text-anchor="middle">owner: product eng lead · expiry 14d</text>

  <rect x="250" y="520" width="250" height="66" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="375" y="540" font-size="11" fill="#78350f" text-anchor="middle" font-weight="600">#pricing-lab</text>
  <text x="375" y="556" font-size="10" fill="#92400e" text-anchor="middle">channel · decision record required</text>
  <text x="375" y="571" font-size="10" fill="#92400e" text-anchor="middle">owner: cfo · authority limit a1</text>

  <!-- ===== legend / notes ===== -->
  <line x1="48" y1="628" x2="1352" y2="628" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="650" font-size="10.5" fill="#475569">depth is a cost, not a status: each level buys isolation and costs a delegation hop, a review hop and a budget split.</text>
  <text x="48" y="668" font-size="10.5" fill="#475569">invariants · one parent per circle · one home per seat · one owner per surface · child ceiling ⊆ parent ceiling · secrets never intersect.</text>
</svg>