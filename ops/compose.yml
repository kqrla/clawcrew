# everything here is yours: postgres, the runner, the health watcher. no vendor in the path.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clawcrew
      POSTGRES_USER: clawcrew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawcrew -d clawcrew"]
      interval: 10s

  migrate:
    build: ../backend
    command: ["npx", "tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://clawcrew:${POSTGRES_PASSWORD}@db:5432/clawcrew
    depends_on:
      db: { condition: service_healthy }

  runner:
    build: ../backend
    command: ["npx", "tsx", "scripts/supervise.ts", "--every", "30000"]
    environment:
      DATABASE_URL: postgres://clawcrew:${POSTGRES_PASSWORD}@db:5432/clawcrew
      # empty means the scripted responder, which is how the loop is tested without a key
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      # empty, not defaulted: half a model configuration is refused by the port on purpose,
      # and a defaulted MODEL_NAME with no key is exactly that half
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 30s

  # the watcher is its own service on purpose: a supervisor cannot report its own death
  health:
    build: ../backend
    command: ["sh", "-c", "while true; do npx tsx scripts/health.ts --max-age-ms 300000 || echo ALERT; sleep 60; done"]
    environment:
      DATABASE_URL: postgres://clawcrew:${POSTGRES_PASSWORD}@db:5432/clawcrew
    depends_on:
      runner: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
